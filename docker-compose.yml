version: '3'
services:
  backend:
    build: ./backend
    image: ape-runner-backend:1.0
    container_name: backend
    ports:
      - "5001:5001"
    networks:
      - app-network

  frontend:
    build: ./Gesture-based-Ape-Runner-Game
    image: ape-runner-frontend:1.0
    container_name: frontend
    ports:
      - "8080:8080"
    environment:
      - BACKEND_URL_PATH=http://backend:5001
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
